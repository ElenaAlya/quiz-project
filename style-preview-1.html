<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Preview 1</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f2ff; color: #241434; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    section { width: min(680px, 100%); background: white; border: 3px solid #241434; border-radius: 8px; padding: 28px; box-shadow: 8px 8px 0 #ffbd3d; }
    h1 { margin: 0 0 10px; font-size: 34px; }
    p { font-size: 18px; line-height: 1.5; }
    button { width: 100%; margin-top: 12px; padding: 16px; border-radius: 8px; border: 2px solid #241434; background: #ffdc5e; font-size: 16px; font-weight: 700; text-align: left; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Какая твоя кофейная личность?</h1>
      <p>Выбери, как начинается твой идеальный выходной.</p>
      <button>Спокойно, с любимым ритуалом</button>
      <button>С чем-то сладким и новым</button>
      <button>За разговором с близким человеком</button>
      <button>Красиво, медленно, со вкусом</button>
    </section>
  </main>
</body>
</html>
