<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Preview 3</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #171513; color: #fff7ed; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    section { width: min(700px, 100%); border-left: 6px solid #d7a256; padding: 28px; background: #24201c; }
    h1 { margin: 0 0 14px; font-size: 42px; text-transform: uppercase; }
    p { font-size: 18px; line-height: 1.5; color: #d9c8b3; }
    button { width: 100%; margin-top: 12px; padding: 16px; border: 1px solid #6d5845; background: #171513; color: #fff7ed; font-size: 16px; text-align: left; }
    button:hover { border-color: #d7a256; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Какая твоя кофейная личность?</h1>
      <p>Выбери, как начинается твой идеальный выходной.</p>
      <button>Спокойно, с любимым ритуалом</button>
      <button>С чем-то сладким и новым</button>
      <button>За разговором с близким человеком</button>
      <button>Красиво, медленно, со вкусом</button>
    </section>
  </main>
</body>
</html>
