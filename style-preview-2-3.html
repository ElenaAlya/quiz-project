<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Preview 2 + 3</title>
  <style>
    :root {
      --ink: #181512;
      --paper: #fbfaf7;
      --coffee: #2a211c;
      --cream: #f4eee4;
      --muted: #b9aa99;
      --accent: #d7a256;
      --green: #6f8560;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 32px;
    }

    section {
      width: min(720px, 100%);
      padding: 34px 0 0;
      border-top: 5px solid var(--accent);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0 0 18px;
      font-size: 42px;
      line-height: 1.08;
      font-weight: 800;
      color: var(--coffee);
    }

    p {
      max-width: 560px;
      margin: 0 0 26px;
      color: #5b5148;
      font-size: 18px;
      line-height: 1.55;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      min-height: 56px;
      padding: 15px 18px;
      border: 1px solid #ded5c9;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--cream);
      transform: translateX(3px);
    }

    .progress {
      margin-top: 24px;
      color: #827568;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main {
        padding: 22px;
        place-items: start center;
      }

      section {
        padding-top: 24px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="eyebrow">Basecamp Coffee</p>
      <h1>Какая твоя кофейная личность?</h1>
      <p>Выбери, как начинается твой идеальный выходной.</p>
      <div class="answers">
        <button>Спокойно, с любимым ритуалом</button>
        <button>С чем-то сладким и новым</button>
        <button>За разговором с близким человеком</button>
        <button>Красиво, медленно, со вкусом</button>
      </div>
      <div class="progress">Вопрос 1 из 6</div>
    </section>
  </main>
</body>
</html>
