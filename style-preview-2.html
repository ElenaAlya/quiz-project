<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Preview 2</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #fbfaf7; color: #1f1d1a; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    section { width: min(640px, 100%); padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 32px; font-weight: 600; }
    p { font-size: 18px; line-height: 1.55; color: #575149; }
    button { width: 100%; margin-top: 10px; padding: 14px 0; border: 0; border-bottom: 1px solid #d8d1c7; background: transparent; color: #1f1d1a; font-size: 16px; text-align: left; }
    button:hover { color: #5f6f52; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Какая твоя кофейная личность?</h1>
      <p>Выбери, как начинается твой идеальный выходной.</p>
      <button>Спокойно, с любимым ритуалом</button>
      <button>С чем-то сладким и новым</button>
      <button>За разговором с близким человеком</button>
      <button>Красиво, медленно, со вкусом</button>
    </section>
  </main>
</body>
</html>
