<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Preview 4</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4eee4; color: #2b2118; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    section { width: min(660px, 100%); background: #fffaf1; border: 1px solid #d8c6ac; border-radius: 8px; padding: 30px; }
    h1 { margin: 0 0 12px; font-size: 36px; font-weight: 700; color: #31513a; }
    p { font-size: 18px; line-height: 1.5; color: #5d5143; }
    button { width: 100%; margin-top: 12px; padding: 15px; border-radius: 8px; border: 1px solid #c9b291; background: #fff; color: #2b2118; font-size: 16px; text-align: left; }
    button:hover { background: #eef3e8; border-color: #748c63; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Какая твоя кофейная личность?</h1>
      <p>Выбери, как начинается твой идеальный выходной.</p>
      <button>Спокойно, с любимым ритуалом</button>
      <button>С чем-то сладким и новым</button>
      <button>За разговором с близким человеком</button>
      <button>Красиво, медленно, со вкусом</button>
    </section>
  </main>
</body>
</html>
